/* Studio — a phone-first shopping app: raspberry accent, geometric display, bento categories, thumb tab bar */
:root{--bg:#FBF8F7;--fg:#1C1427;--muted:#6E6578;--line:#ECE4E8;--surface:#F2ECEF;--card:#FFFFFF;--accent:#C2185B;--accent-fg:#FFFFFF;--danger:#B42318;--soft:#FCE4EE;
--display:"Syne","Trebuchet MS",system-ui,sans-serif;--display-w:700;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--r:18px;--r-sm:12px;--r-btn:999px;--r-pill:999px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141017;--fg:#F4EFF6;--muted:#A79DB0;--line:#2D2633;--surface:#1E1922;--card:#1E1922;--accent:#FF5C9A;--accent-fg:#1B0B12;--danger:#FF8A7A;--soft:#3A1828;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141017;--fg:#F4EFF6;--muted:#A79DB0;--line:#2D2633;--surface:#1E1922;--card:#1E1922;--accent:#FF5C9A;--accent-fg:#1B0B12;--danger:#FF8A7A;--soft:#3A1828;color-scheme:dark}

.c-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.c-head__in{display:flex;justify-content:space-between;align-items:center;min-height:60px;gap:10px}
.c-mark{background:none;border:0;cursor:pointer;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--fg);padding:0}
.c-mark b{color:var(--accent);font-weight:800}
.c-topnav{display:flex;gap:8px}
.c-count{background:var(--accent-fg);color:var(--accent);border-radius:9px;min-width:18px;height:18px;font-size:11px;display:inline-grid;place-items:center;padding:0 5px}
.c-hello{padding-block:24px 8px}
.c-hello__card{display:flex;gap:20px;align-items:center;padding:24px;border-radius:var(--r);background:var(--soft)}
.c-hello__av{width:84px;height:84px;font-size:30px}
.c-hello__txt{min-width:0}
.c-hello__hi{margin:0;font-weight:600;color:var(--accent)}
.c-hello__h{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,42px);line-height:1.05;margin:6px 0 8px;letter-spacing:-.02em;text-wrap:balance}
.c-hello__txt p:last-child{margin:0;max-width:56ch}
.c-bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:150px;gap:12px;padding-block:20px}
.c-tile{position:relative;overflow:hidden;border:0;padding:0;border-radius:var(--r);cursor:pointer;background:var(--surface);text-align:left;color:#fff}
.c-tile .bs-media{position:absolute;inset:0;aspect-ratio:auto;height:100%;width:100%}
.c-tile .bs-flag{display:none}
.c-tile::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,10,20,.7),rgba(20,10,20,0) 60%)}
.c-tile__l{position:absolute;left:14px;bottom:12px;z-index:1;font-family:var(--display);font-weight:700;font-size:20px;display:flex;flex-direction:column;line-height:1.1}
.c-tile__l small{font-family:var(--body);font-weight:400;font-size:12px;opacity:.85}
.c-tile--fragrance{grid-column:span 2;grid-row:span 2}
.c-tile--watches{grid-row:span 2}
.c-tile--gifts{grid-column:span 2}
.c-tile--bags{grid-column:span 2}
.c-new{padding-block:16px}
.c-h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0}
.c-new__row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,200px);gap:12px;overflow-x:auto;padding:14px max(16px,calc((100% - 1180px)/2 + 16px)) 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.c-shop{padding-block:24px}
.c-shop__bar{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding-block:12px;display:flex;flex-direction:column;gap:10px}
.c-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.c-chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-size:14px}
.c-chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.c-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:8px}
.c-card{scroll-snap-align:start;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;cursor:pointer;text-align:left;min-width:0}
.c-card .bs-media{border-radius:0}
.c-card__b{display:flex;flex-direction:column;gap:2px;padding:10px 12px 14px}
.c-card__n{font-weight:600;font-size:14px;line-height:1.3}
.c-card__t{font-size:12px;color:var(--muted)}
.c-steps{padding-block:32px;display:grid;gap:18px}
.c-about{display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding-block:28px 40px;border-top:1px solid var(--line)}
.c-foot__in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding-block:20px;font-size:13px;color:var(--muted)}
.c-link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.c-tabbar{display:none}
@media (max-width:900px){.c-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.c-bento{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:130px}.c-tile--watches{grid-row:span 1}}
@media (max-width:640px){
 .c-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .c-hello__card{flex-direction:column;align-items:flex-start;padding:20px}
 .c-topnav{display:none}
 .c-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));justify-content:space-around}
 .c-tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;font-size:11px;color:var(--muted);padding:6px 16px;cursor:pointer;min-height:48px}
 .c-tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
 .c-tabbar .bs-badge{top:0;right:6px}
 .c-foot{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
 body.bs-managing .c-foot{padding-bottom:0}
 .bs-toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.bs-lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bs-wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bs-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.bs-muted{color:var(--muted)}
.bs-small{font-size:13px}
.bs-select{user-select:all;-webkit-user-select:all}
.bs-media{position:relative;overflow:hidden;background:var(--surface);aspect-ratio:4/5;max-width:100%}
.bs-media img,.bs-media .bs-illo{width:100%;height:100%;object-fit:cover;display:block}
.bs-media--xs{width:56px;flex:none;border-radius:var(--r-sm)}
.bs-media--sm{width:100%;border-radius:var(--r-sm)}
.bs-media--lg{border-radius:var(--r)}
.bs-flag{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--accent-fg);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:var(--r-pill)}
.bs-flag--out{background:var(--fg);color:var(--bg)}
.bs-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;font-weight:500;font-size:14px;letter-spacing:.02em;white-space:nowrap}
.bs-btn--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.bs-btn--ghost{background:transparent}
.bs-btn--sm{min-height:36px;padding:0 14px;font-size:13px}
.bs-btn--wide{width:100%}
.bs-btn[disabled]{opacity:.45;cursor:not-allowed}
.bs-iconbtn{position:relative;display:inline-flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:8px;min-height:44px}
.bs-badge{position:absolute;top:2px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
/* sheet */
.bs-sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
.bs-sheet__scrim{position:absolute;inset:0;background:rgba(10,10,12,.48)}
.bs-sheet__panel{position:relative;width:min(560px,100%);height:100%;overflow-y:auto;background:var(--bg);padding:56px max(20px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 20px;box-shadow:-20px 0 60px rgba(0,0,0,.18);animation:bs-in .28s ease}
.bs-sheet[data-kind="product"] .bs-sheet__panel{width:min(960px,100%)}
@keyframes bs-in{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:640px){.bs-sheet{align-items:flex-end}.bs-sheet__panel{height:auto;max-height:92%;border-radius:18px 18px 0 0;padding-top:52px;animation:bs-up .28s ease}@keyframes bs-up{from{transform:translateY(30px)}to{transform:none}}}
@media (prefers-reduced-motion:reduce){.bs-sheet__panel{animation:none}}
.bs-sheet__close{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:22px;line-height:1;cursor:pointer}
.bs-sheet__title{font-family:var(--display);font-weight:var(--display-w);font-size:28px;line-height:1.1;margin:4px 0 12px;text-wrap:balance}
/* product detail */
.bs-pd{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.bs-pd__media{min-width:0}
.bs-pd__info{min-width:0;display:flex;flex-direction:column;gap:10px}
.bs-pd__name{font-family:var(--display);font-weight:var(--display-w);font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.bs-code{margin:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.bs-pd__desc{margin:0}
.bs-pricenote{margin:0;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);font-size:13px;color:var(--muted)}
.bs-pd__actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.bs-pd .bs-pairs{grid-column:1/-1}
.bs-thumbs{display:flex;gap:8px;margin-top:10px}
.bs-thumb{width:58px;padding:0;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;cursor:pointer;background:none;opacity:.6}
.bs-thumb.is-on{opacity:1;border-color:var(--fg)}
.bs-thumb img{display:block;aspect-ratio:1;object-fit:cover}
.bs-sizes{border:0;padding:0;margin:4px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.bs-sizes legend{font-size:12px;color:var(--muted);margin-bottom:6px;padding:0}
.bs-sizes label{position:relative}
.bs-sizes input{position:absolute;opacity:0;inset:0}
.bs-sizes span{display:grid;place-items:center;min-width:44px;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;font-variant-numeric:tabular-nums}
.bs-sizes input:checked+span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bs-sizes input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.bs-err{color:var(--danger);font-size:13px;margin:0}
.bs-pairs{border-top:1px solid var(--line);padding-top:18px;margin-top:6px}
.bs-pairs__row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.bs-pairs--bag .bs-pairs__row{grid-template-columns:repeat(2,1fr)}
.bs-pair{display:flex;flex-direction:column;gap:4px;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.bs-pair__cat{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.bs-pair__name{font-size:13px;line-height:1.3}
@media (max-width:640px){.bs-pd{grid-template-columns:1fr;gap:18px}.bs-pd__name{font-size:26px}}
/* bag */
.bs-lines{list-style:none;padding:0;margin:0 0 8px;display:flex;flex-direction:column}
.bs-line,.bs-mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.bs-line__txt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px}
.bs-line__name{font-size:14px;font-weight:500}
.bs-qty{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.bs-qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer}
.bs-send,.bs-edit,#bs-mset{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.bs-send label,.bs-edit label,#bs-mset label{font-size:12px;color:var(--muted);margin-top:4px}
.bs-send input,.bs-send textarea,.bs-edit input,.bs-edit select,.bs-edit textarea,#bs-mset input,#bs-mset textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-height:44px}
/* pix */
.bs-pix{display:flex;flex-direction:column;gap:12px}
.bs-qr{align-self:flex-start;padding:12px;background:#fff;border-radius:var(--r-sm);border:1px solid var(--line)}
.bs-qr img,.bs-qr canvas{display:block}
.bs-kv{margin:0;display:grid;gap:8px}
.bs-kv div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.bs-kv dt{color:var(--muted);font-size:13px}.bs-kv dd{margin:0;font-weight:500;word-break:break-all;text-align:right}
/* owner + how */
.bs-owner{display:flex;gap:18px;align-items:flex-start}
.bs-owner__mono{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:26px;overflow:hidden}
.bs-owner__mono img{width:100%;height:100%;object-fit:cover}
.bs-owner__txt{min-width:0}
.bs-owner__txt p{margin:4px 0 0}
.bs-owner__name{font-family:var(--display);font-weight:var(--display-w);font-size:26px;margin:2px 0 0}
.bs-how{list-style:none;counter-reset:s;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.bs-how li{counter-increment:s;display:flex;flex-direction:column;gap:4px;padding-top:14px;border-top:1px solid var(--line)}
.bs-how li::before{content:counter(s);font-family:var(--display);font-size:22px;color:var(--accent)}
.bs-how span{color:var(--muted);font-size:14px}
@media (max-width:640px){.bs-how{grid-template-columns:1fr}}
/* toast */
.bs-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:var(--r-pill);font-size:14px;z-index:60;max-width:calc(100% - 32px)}
/* manager */
.bs-manage{padding-block:28px 60px}
.bs-manage__top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.bs-manage__h{font-family:var(--display);font-weight:var(--display-w);font-size:32px;margin:4px 0 0}
.bs-manage__save{display:flex;gap:10px;flex-wrap:wrap}
.bs-status{margin:16px 0;padding:10px 14px;border-radius:var(--r-sm);background:var(--surface);font-size:14px}
.bs-note{margin-top:16px;padding:14px;border:1px solid var(--accent);border-radius:var(--r-sm);font-size:14px}
.bs-manage__grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:32px}
.bs-manage__bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bs-h3{font-size:16px;margin:0}
.bs-mlist{list-style:none;padding:0;margin:10px 0 0}
.bs-mrow.is-hidden{opacity:.5}
.bs-mrow__btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bs-msettings{align-self:start;padding:18px;border:1px solid var(--line);border-radius:var(--r)}
.bs-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bs-two>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.bs-checks{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.bs-checks label{display:flex;align-items:center;gap:6px;color:var(--fg)!important;font-size:14px!important}
.bs-phs{display:flex;flex-wrap:wrap;gap:8px}
.bs-ph{position:relative;width:72px}
.bs-ph img{display:block;width:72px;height:90px;object-fit:cover;border-radius:var(--r-sm)}
.bs-ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);cursor:pointer}
body.bs-managing .bs-store{display:none}
@media (max-width:800px){.bs-manage__grid{grid-template-columns:1fr}}
.bs-mt{margin-top:22px}
.bs-login{max-width:420px;display:flex;flex-direction:column;gap:12px}
.bs-ph--wait{display:grid;place-items:center;width:72px;height:90px;border:1px dashed var(--line);border-radius:var(--r-sm);font-size:11px;color:var(--muted)}

.bs-share{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.bs-share__l{width:100%;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bs-share__b{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;font-size:13px;cursor:pointer}
.bs-share__b svg{width:18px;height:18px;flex:none}
.bs-share__b--wa svg{color:#25D366}.bs-share__b--ms svg{color:#0A7CFF}.bs-share__b--fb svg{color:#1877F2}
/* Stories */
.c-stories{padding-top:14px}
.bs-rings{display:flex;gap:14px;overflow-x:auto;padding:4px max(16px,calc((100% - 1180px)/2 + 16px)) 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.bs-rings::-webkit-scrollbar{display:none}
.bs-ring{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--fg);font:inherit;scroll-snap-align:start;width:76px}
.bs-ring__c{width:70px;height:70px;border-radius:50%;padding:3px;background:var(--line);display:block;transition:transform .15s}
.bs-ring.is-new .bs-ring__c{background:conic-gradient(from 200deg,#FF5C9A,#C2185B,#F7B267,#FF5C9A)}
.bs-ring__c img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid var(--bg);display:block;box-sizing:border-box}
.bs-ring:active .bs-ring__c{transform:scale(.94)}
.bs-ring__l{font-size:12px;line-height:1.2;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bs-ring:not(.is-new) .bs-ring__l{color:var(--muted)}
.c-new__hint{margin:2px 0 0;font-size:13px;color:var(--muted)}
.bs-story{position:fixed;inset:0;z-index:55;background:#000;color:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--body);animation:bsStoryIn .22s ease-out}
@keyframes bsStoryIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.bs-story__bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(36px) brightness(.45);transform:scale(1.1)}
.bs-story__stage{position:absolute;inset:0;display:grid;place-items:center;padding:72px 0 210px}
@media (min-width:700px){.bs-story__stage{padding:76px 0 230px}}
.bs-story__img{max-width:min(100%,560px);max-height:100%;object-fit:contain;border-radius:14px;box-shadow:0 20px 60px #0008;animation:bsKen 6s ease-out both;pointer-events:none}
@keyframes bsKen{from{transform:scale(1.04)}to{transform:scale(1)}}
.bs-story__top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 18px;background:linear-gradient(#0009,#0000);z-index:3}
.bs-story__bars{display:flex;gap:4px;max-width:560px;margin:0 auto}
.bs-story__bar{flex:1;height:3px;border-radius:3px;background:#ffffff4d;overflow:hidden}
.bs-story__bar i{display:block;height:100%;background:#fff;width:0}
.bs-story__who{display:flex;align-items:center;gap:10px;max-width:560px;margin:10px auto 0;font-size:14px}
.bs-story__who img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.bs-story__who span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bs-story__x{background:none;border:0;color:#fff;font-size:34px;line-height:1;cursor:pointer;padding:0 4px;width:44px;height:44px}
.bs-story__nav{position:absolute;top:70px;bottom:210px;background:none;border:0;padding:0;cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}
.bs-story__nav--prev{left:0;width:33%}
.bs-story__nav--next{right:0;width:67%}
.bs-story__foot{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:40px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0000,#000c 38%);max-width:592px;margin:0 auto;box-sizing:border-box}
.bs-story__tag{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.bs-story__n{font-family:var(--display);font-size:24px;line-height:1.1;margin:8px 0 4px;letter-spacing:-.01em}
.bs-story__d{margin:0 0 12px;font-size:14px;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bs-story__pairs{display:flex;gap:8px;align-items:center;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
.bs-story__pairs span{font-size:12px;opacity:.75;flex:0 0 auto}
.bs-story__pairs button{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#ffffff26;border:1px solid #ffffff40;color:#fff;border-radius:999px;padding:4px 12px 4px 4px;font:inherit;font-size:13px;cursor:pointer;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs-story__pairs img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.bs-story__acts{display:flex;gap:10px;align-items:center}
.bs-story__add{flex:1;min-height:48px;border:0;border-radius:999px;background:#fff;color:#1C1427;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:transform .12s,background .2s}
.bs-story__add:active{transform:scale(.97)}
.bs-story__add.is-on{background:var(--accent);color:#fff}
.bs-story__out{flex:1;font-size:14px;opacity:.85}
.bs-story__ic{flex:0 0 48px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ffffff26;border:1px solid #ffffff40;color:#fff;cursor:pointer;padding:0}
.bs-story__ic svg{width:22px;height:22px}
.bs-story__hint{margin:10px 0 0;text-align:center;font-size:11px;opacity:.55}
.bs-story.is-paused .bs-story__top,.bs-story.is-paused .bs-story__foot{opacity:.25;transition:opacity .2s}
@media (prefers-reduced-motion:reduce){.bs-story,.bs-story__img{animation:none}}

    document.addEventListener("submit", onSubmit);

    document.addEventListener("keydown", function (e) { if (storyKey(e)) return; if (e.key === "Escape" && !sheet.hidden) closeSheet(); });
    window.addEventListener("hashchange", route);
    render(); route(); refreshCatalog();
  }
  var toastT;
  function toast(msg) { var t = $("#bs-toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2200); }

  function onClick(e) {
    var ms = e.target.closest(".bs-share__b--ms");
    if (ms && !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) { e.preventDefault(); window.open(ms.getAttribute("data-fallback"), "_blank", "noopener"); return; }
    var el = e.target.closest("[data-act]"); if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "open") { e.preventDefault(); openProduct(el.getAttribute("data-id")); }
    else if (a === "story") { e.preventDefault(); openStory(el.getAttribute("data-set"), el.getAttribute("data-id")); }
    else if (a === "close") { closeSheet(); M.editing = null; }
    else if (a === "cat") { state.cat = el.getAttribute("data-cat"); render(); var t = $("#bs-shop"); if (t && el.hasAttribute("data-scroll")) t.scrollIntoView({ behavior: "smooth", block: "start" }); }
    else if (a === "bag") openSheet(bagHTML(), "bag");
    else if (a === "pix") openPix();
    else if (a === "photo") {
      var p = byId($(".bs-pd").getAttribute("data-id")), i = +el.getAttribute("data-src");
      var m = $("#bs-pd-media .bs-media img"); if (m) m.src = p.photos[i];
      document.querySelectorAll(".bs-thumb").forEach(function (b, j) { b.classList.toggle("is-on", j === i); });
    }
    else if (a === "add") {
      var id = el.getAttribute("data-id"), pr = byId(id), size = "";
      if (pr.sizes && pr.sizes.length) { var r = $('input[name="bs-size"]:checked'); if (!r) { $("#bs-pd-err").hidden = false; return; } size = r.value; }
      var ex = state.bag.filter(function (b) { return b.id === id && b.size === size; })[0];
      if (ex) ex.qty++; else state.bag.push({ id: id, size: size, qty: 1 });
      saveBag(); closeSheet(); toast(pr.name + " added to your request");
    }
    else if (a === "qty") {
      var b = state.bag[+el.getAttribute("data-i")]; b.qty += +el.getAttribute("data-d");
      if (b.qty <= 0) state.bag.splice(+el.getAttribute("data-i"), 1);
      saveBag(); sheetBody.innerHTML = bagHTML();
    }
    else if (a === "copy") { copyText(el.getAttribute("data-copy") === "key" ? DATA.settings.pixKey : pixCode(), $("#bs-copy-msg")); }
    else if (a === "manage") { location.hash = "manage"; }
    else if (a === "copylink") { var url = el.getAttribute("data-url"); try { navigator.clipboard.writeText(url).then(function () { toast("Link copied"); }, function () { window.prompt ? toast(url) : 0; }); } catch (x) { toast(url); } }
    else if (a === "m-exit") { history.replaceState(null, "", location.pathname + location.search); state.view = "shop"; render(); }
    else if (a === "m-new") { M.editing = { isNew: true, p: { id: "", name: "", cat: "clothing", style: "everyday", who: "her", sizes: [], desc: "", photos: [], isNew: true } }; openSheet(editHTML(M.editing.p, true), "edit"); }
    else if (a === "m-edit") { var i2 = +el.getAttribute("data-i"); M.editing = { i: i2, p: JSON.parse(JSON.stringify(M.draft.products[i2])) }; openSheet(editHTML(M.editing.p, false), "edit"); }
    else if (a === "m-del") {
      var i3 = +el.getAttribute("data-i");
      if (el.getAttribute("data-sure")) { M.draft.products.splice(i3, 1); mark(); }
      else { el.setAttribute("data-sure", "1"); el.textContent = "Tap again to remove"; }
    }
    else if (a === "m-phdel") { M.editing.p.photos.splice(+el.getAttribute("data-i"), 1); keepForm(); sheetBody.innerHTML = editHTML(M.editing.p, M.editing.isNew); }
    else if (a === "m-save") publishDraft();
    else if (a === "m-logout") { M.pass = ""; M.draft = null; M.status = ""; try { sessionStorage.removeItem("bs-pass"); } catch (x) {} render(); }
  }
  function keepForm() {
    var p = M.editing.p, v = function (id) { var x = document.getElementById(id); return x ? x.value : ""; };
    p.name = v("e-name"); p.who = v("e-who") || "all"; p.cat = v("e-cat"); p.style = v("e-style"); p.desc = v("e-desc");
    p.sizes = v("e-sizes").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    p.isNew = !!($("#e-new") || {}).checked; p.soldOut = !!($("#e-out") || {}).checked; p.hidden = !!($("#e-hide") || {}).checked;
  }
  function onChange(e) {
    if (e.target.id === "e-photos") {
      keepForm();
      var files = Array.prototype.slice.call(e.target.files || [], 0, Math.max(0, 4 - M.editing.p.photos.length));
      if (!files.length) return;
      var ed = M.editing; M.uploading += files.length; sheetBody.innerHTML = editHTML(ed.p, ed.isNew);
      files.reduce(function (chain, f) {
        return chain.then(function () { return upload(f).then(function (url) { ed.p.photos.push(url); }); }).then(function () { M.uploading--; }, function (err) { M.uploading--; if (authFail(err)) throw err; ed.err = err.message; });
      }, Promise.resolve()).then(function () {
        if (M.editing === ed) { sheetBody.innerHTML = editHTML(ed.p, ed.isNew); if (ed.err) { var x = $("#e-err"); x.textContent = "Some photos did not upload: " + ed.err; x.hidden = false; ed.err = null; } }
      }, function () {});
    }
  }
  function onSubmit(e) {
    var f = e.target;
    if (f.id === "bs-send") {
      e.preventDefault();
      var name = $("#bs-name").value.trim(), note = $("#bs-note").value.trim();
      try { localStorage.setItem("bs-name", name); } catch (x) {}
      var link = waLink(requestText(name, note)), err = $("#bs-send-err");
      if (!link) { err.textContent = "Patrícia's WhatsApp number is not set yet."; err.hidden = false; return; }
      var aEl = document.createElement("a"); aEl.href = link; aEl.target = "_blank"; aEl.rel = "noopener"; document.body.appendChild(aEl); aEl.click(); aEl.remove();
      err.innerHTML = 'If WhatsApp did not open, <a href="' + link + '" target="_blank" rel="noopener">tap here</a>.'; err.hidden = false;
    } else if (f.id === "bs-edit") {
      e.preventDefault(); keepForm();
      var p = M.editing.p, er = $("#e-err");
      if (!p.name.trim()) { er.textContent = "Give the item a name."; er.hidden = false; return; }
      if (M.editing.isNew) { p.id = nextId(M.draft); if (!p.photos.length) p.illo = null; M.draft.products.unshift(p); }
      else M.draft.products[M.editing.i] = p;
      M.editing = null; closeSheet(); mark();
    } else if (f.id === "bs-mset") {
      e.preventDefault();
      var s = M.draft.settings, g = function (id) { return document.getElementById(id).value.trim(); };
      s.owner = g("s-owner"); s.whatsapp = g("s-whats"); s.pixKey = g("s-pixkey"); s.pixName = g("s-pixname"); s.pixCity = g("s-pixcity"); s.about = g("s-about");
      var file = $("#s-photo").files[0];
      if (file) { M.status = "Uploading photo…"; renderManager(); upload(file).then(function (u) { s.ownerPhoto = u; M.status = ""; mark(); }, function (err) { if (!authFail(err)) { M.status = err.message; renderManager(); } }); } else mark();
    } else if (f.id === "bs-login") {
      e.preventDefault();
      var pw = $("#bs-pw").value; M.busy = true; M.status = ""; renderManager();
      call("login", { pass: pw }).then(function (j) {
        M.busy = false; M.pass = pw; try { sessionStorage.setItem("bs-pass", pw); } catch (x) {}
        if (j.catalog) applyCatalog(j.catalog);
        M.draft = JSON.parse(JSON.stringify(DATA)); M.dirty = 0; render();
      }, function (err) { M.busy = false; M.status = err.code === "auth" ? "Wrong password. Try again." : (err.message || "Could not connect. Check the internet."); renderManager(); });
    } else if (f.id === "bs-pwform") {
      e.preventDefault();
      var np = $("#s-newpw").value, msg = $("#s-pwmsg");
      if (np.length < 6) { msg.textContent = "Use at least 6 characters."; return; }
      msg.textContent = "Saving…";
      call("setpass", { pass: M.pass, newPass: np }).then(function () { M.pass = np; try { sessionStorage.setItem("bs-pass", np); } catch (x) {} msg.textContent = "Password changed. Use the new one next time."; $("#s-newpw").value = ""; }, function (err) { if (!authFail(err)) msg.textContent = err.message; });
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script></body></html>
